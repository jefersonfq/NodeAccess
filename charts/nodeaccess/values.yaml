nameOverride: ""
fullnameOverride: ""

image:
  repository: nodeaccess-backend
  tag: "0.1.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []

existingSecret: ""
config:
  APP_FRONTEND_URL: ""
  TENANT_BASE_DOMAIN: ""
  AUTH_OIDC_ALLOW_JIT: "false"
  AUTH_OIDC_ALLOW_AUTOMATIC_LINKING: "false"
  AUTH_ALLOW_EMAIL_TENANT_DISCOVERY: "true"
extraEnv: {}

api:
  enabled: true
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

gateway:
  enabled: true
  replicas: 2
  port: 3001
  terminationGracePeriodSeconds: 120
  drainTimeoutSeconds: 110
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: "2", memory: 2Gi }

frontend:
  enabled: false
  image:
    repository: nodeaccess-frontend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

migrations:
  enabled: true
  backoffLimit: 3

guacd:
  enabled: false
  image: guacamole/guacd:1.5.5
  port: 4822

ollama:
  enabled: false
  image: ollama/ollama:0.11.4
  port: 11434
  model: qwen2.5-coder:3b
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { cpu: "4", memory: 8Gi }
  nodeSelector: {}
  tolerations: []
  affinity: {}

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  capabilities: { drop: ["ALL"] }
  readOnlyRootFilesystem: false

ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  host: nodeaccess.example.com
  tlsSecretName: ""
  apiPaths: ["/api", "/health", "/metrics"]
  gatewayPaths: ["/ws", "/api/v1/tunnels", "/api/v1/web-access"]

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false

tests:
  enabled: true
  image: busybox:1.36

# Optional resources for the Prometheus Operator. Keep disabled when its CRDs
# are not installed. METRICS_TOKEN must exist in existingSecret when scraping.
monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}
    metricsTokenSecretKey: METRICS_TOKEN
  prometheusRule:
    enabled: false
    additionalLabels: {}
    discoveryFailures:
      window: 10m
      threshold: 3
      for: 5m
    tokenValidationFailures:
      window: 10m
      threshold: 5
      for: 5m
    loginErrors:
      window: 10m
      threshold: 3
      for: 5m
    redisUnavailable:
      for: 2m

nodeSelector: {}
tolerations: []
affinity: {}
