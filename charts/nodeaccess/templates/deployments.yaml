{{- if ge (int .Values.gateway.drainTimeoutSeconds) (int .Values.gateway.terminationGracePeriodSeconds) }}
{{- fail "gateway.drainTimeoutSeconds must be lower than gateway.terminationGracePeriodSeconds" }}
{{- end }}
{{- range $component := list "api" "gateway" }}
{{- $cfg := index $.Values $component }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nodeaccess.fullname" $ }}-{{ $component }}
  labels:
    {{- include "nodeaccess.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "nodeaccess.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      serviceAccountName: {{ include "nodeaccess.serviceAccountName" $ }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ if eq $component "gateway" }}{{ $.Values.gateway.terminationGracePeriodSeconds }}{{ else }}30{{ end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          env:
            - name: APP_MODE
              value: {{ $component | quote }}
            {{- if eq $component "gateway" }}
            - name: GATEWAY_DRAIN_TIMEOUT_SECONDS
              value: {{ $.Values.gateway.drainTimeoutSeconds | quote }}
            {{- end }}
          envFrom:
            - configMapRef: { name: {{ include "nodeaccess.fullname" $ }} }
            - secretRef: { name: {{ required "existingSecret is required" $.Values.existingSecret }} }
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
      {{- with $.Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
