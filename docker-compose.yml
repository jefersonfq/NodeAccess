# Ambiente de desenvolvimento
# Uso com npm run dev: docker compose up -d mysql redis guacd
# API disponível em http://localhost:3000
# SSH Gateway disponível em http://localhost:3001
# MySQL disponível em localhost:3306
# Redis disponível em localhost:6379
#
# Nginx (proxy unificado) será adicionado quando o frontend estiver implementado.

# Preserve a identidade dos volumes ao mudar a pasta de trabalho (OneDrive/WSL).
name: nodeaccess

services:

  # ---------------------------------------------------------------------------
  # Banco de dados
  # ---------------------------------------------------------------------------
  mysql:
    image: nodeaccess-mysql:8.4.12-1
    build: { context: ., dockerfile: docker/state.Dockerfile, target: mysql }
    # Local development only. Production retains its independently sized profile.
    # Keep durability settings from nodeaccess.cnf; only reduce resource budgets.
    command:
      - mysqld
      - --defaults-extra-file=/etc/mysql/nodeaccess.cnf
      - --innodb-buffer-pool-size=${NODEACCESS_DEV_MYSQL_BUFFER_POOL:-512M}
      - --innodb-buffer-pool-instances=1
      - --innodb-redo-log-capacity=${NODEACCESS_DEV_MYSQL_REDO_CAPACITY:-256M}
      - --innodb-log-buffer-size=16M
      - --max-connections=${NODEACCESS_DEV_MYSQL_MAX_CONNECTIONS:-100}
    container_name: nodeaccess-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/include.cnf:/etc/mysql/nodeaccess.cnf:ro
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Cache / Sessões
  # ---------------------------------------------------------------------------
  redis:
    image: nodeaccess-redis:8.2.10-1
    build: { context: ., dockerfile: docker/state.Dockerfile, target: redis }
    container_name: nodeaccess-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Gateway grafico RDP/VNC
  # ---------------------------------------------------------------------------
  guacd:
    image: guacamole/guacd:1.5.5
    container_name: nodeaccess-guacd
    command: ["/opt/guacamole/sbin/guacd", "-b", "0.0.0.0", "-L", "debug", "-f"]
    restart: unless-stopped
    ports:
      - "4822:4822"

  # ---------------------------------------------------------------------------
  # API REST (porta 3000)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: dev
    container_name: nodeaccess-api
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # SSH Gateway / WebSocket (porta 3001)
  # ---------------------------------------------------------------------------
  ssh-gateway:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: dev
    container_name: nodeaccess-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: gateway
    ports:
      - "3001:3001"
      - "${NATIVE_SSH_GATEWAY_PORT:-2222}:${NATIVE_SSH_GATEWAY_PORT:-2222}"
    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./data/ssh-gateway:/var/lib/nodeaccess/ssh-gateway:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
