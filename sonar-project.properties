sonar.projectKey=nodeaccess
sonar.projectName=NodeAccess
sonar.sourceEncoding=UTF-8
# Product workspaces + operational tooling; no docs, runtime recordings or secrets.
sonar.sources=apps/backend/src,apps/backend/prisma,apps/frontend/src,apps/frontend/index.html,apps/agent/src,packages/shared/src,scripts,tools
sonar.tests=apps/backend/src,apps/frontend/src,apps/agent/src,packages/shared/src,tools,scripts
sonar.test.inclusions=**/*.test.ts,**/*.test.js,**/*.test.mjs,**/*.test.cjs,**/*.spec.ts,**/*.spec.js,**/*.test.py
sonar.exclusions=**/node_modules/**,**/dist/**,coverage/**,**/.scannerwork/**,**/.sonar-reports/**,tools/load-tests/data/**,tools/load-tests/reports/**,tools/deploy/reports/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage/python.xml
# Never narrow coverage exclusions merely to improve the Quality Gate.
