name: Stack upgrade and recovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'scripts/deploy/**'
      - 'scripts/backup/**'
      - 'scripts/lib/stateful-upgrade*'
      - 'tools/deploy/stack-upgrade-real.mjs'
      - 'tools/deploy/prisma-config-compatibility.test.mjs'
      - 'tools/deploy/container-stack-real.mjs'
      - 'tools/deploy/runtime-nonroot-real.mjs'
      - 'tools/deploy/engineering-security-headers-harness.py'
      - 'apps/frontend/index.html'
      - 'tools/tls/**'
      - 'security/*image-triage.json'
      - 'scripts/security/*image*'
      - 'apps/backend/prisma/**'
      - 'apps/backend/src/**'
      - 'apps/frontend/src/**'
      - 'packages/shared/**'
      - 'charts/nodeaccess/**'
      - '**/package.json'
      - 'package-lock.json'
      - '.github/workflows/stack-compatibility.yml'
permissions:
  contents: read
jobs:
  upgrade-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w apps/backend && npm run build -w packages/shared
      - run: npm run test:stack:guards && npm run test:stack:prisma
      - run: docker build -f docker/state.Dockerfile --target mysql -t nodeaccess-mysql:8.4.12-1 .
      - run: docker build -f docker/state.Dockerfile --target redis -t nodeaccess-redis:8.2.10-1 .
      - run: docker build -f docker/guacd.Dockerfile -t nodeaccess-guacd:1.6.0-1 .
      - run: docker pull mysql:8.0 && docker pull redis:7-alpine
      - run: npm run test:stack:upgrade:real
        env:
          RUN_STACK_UPGRADE_REAL: 'true'
      - run: docker build -f docker/backend.Dockerfile --target runtime -t nodeaccess-backend:security-local .
      - run: docker build -f docker/frontend.Dockerfile --target prod -t nodeaccess-frontend:security-local .
      - run: docker build -f docker/frontend.Dockerfile --target prod-k8s -t nodeaccess-frontend-k8s:security-local .
      - run: docker build -f docker/frontend.Dockerfile --target tls-agent -t nodeaccess-tls-agent:security-local .
      - run: npm run test:runtime-nonroot:real
        env:
          RUN_NONROOT_REAL: 'true'
      - run: python3 tools/deploy/engineering-security-headers-harness.py
      - run: npm run test:stack:containers:real
        env:
          RUN_CONTAINER_STACK_REAL: 'true'
      - run: npm run test:tls:integration
        env:
          TLS_TEST_IMAGE: nodeaccess-tls-agent:security-local
      - run: node --test scripts/security/image-policy.test.mjs scripts/security/guacd-image-policy.test.mjs
      - run: npm run security:images -- nodeaccess-backend:security-local nodeaccess-frontend:security-local nodeaccess-frontend-k8s:security-local nodeaccess-tls-agent:security-local nodeaccess-mysql:8.4.12-1 nodeaccess-redis:8.2.10-1 nodeaccess-guacd:1.6.0-1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-upgrade-report
          path: |
            /tmp/nodeaccess-stack-upgrade/report.json
            /tmp/nodeaccess-container-stack/report.json
            /tmp/nodeaccess-nonroot-report.json
            /tmp/nodeaccess-nginx-headers.json
            /tmp/nodeaccess-tls-integration.json
            artifacts/security/images/
          retention-days: 14
