name: Security checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run security:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-and-sbom
          path: artifacts/security/
          retention-days: 14
  static-and-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: node scripts/security/scan-local.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-security-reports
          path: artifacts/security/
          retention-days: 14
