name: Quality gate

on:
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: mysql://nodeaccess_test:nodeaccess_test@127.0.0.1:3306/nodeaccess_test
  REDIS_URL: redis://127.0.0.1:6379
  JWT_SECRET: nodeaccess-ci-jwt-secret-at-least-32-characters
  PEM_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w apps/backend
      - run: npm run build -w packages/shared
      - run: npm run lint:changed
      - run: npm run typecheck
      - run: npm run test:change-governance
      - run: npm run test:runtime-permissions
      - run: node --test scripts/recovery.test.mjs scripts/security/history-secrets.test.mjs
      - run: node --test tools/deploy/release-provenance.test.mjs tools/deploy/release-package.test.mjs
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w apps/backend
      - run: npm run build -w packages/shared
      - run: npm test -- --testTimeout=10000
  oidc-and-helm-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Validate simulated Entra and Okta contracts
        run: npm run test:oidc:compatibility
      - name: Validate SCIM 2.0 provisioning contract
        run: npm run test:scim:compatibility
      - name: Validate Helm chart
        run: npm run test:helm-chart
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w apps/backend
      - run: npm run build -w packages/shared
      - run: npm run build
