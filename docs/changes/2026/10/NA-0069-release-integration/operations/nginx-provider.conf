# Include only inside nginx http {}; activate after the dedicated bridge exists.
server {
    listen 10.208.68.1:9000 ssl;
    server_name trial-provisioner.nodeaccess.internal;
    ssl_certificate /etc/nodeaccess-trial/server.crt;
    ssl_certificate_key /etc/nodeaccess-trial/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 10.208.68.2;
    allow 10.208.68.3;
    deny all;
    access_log off;
    client_max_body_size 2k;
    location /v1/labs/ {
        proxy_pass https://127.0.0.1:9443;
        proxy_ssl_server_name on;
        proxy_ssl_name trial-provisioner.nodeaccess.internal;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nodeaccess-trial/ca.crt;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 15s;
    }
    location / { return 404; }
}
