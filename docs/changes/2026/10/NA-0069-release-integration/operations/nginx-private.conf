user nginx;
worker_processes 1;
pid /run/nginx-nodeaccess-trial/nginx.pid;
error_log /var/log/nginx/nodeaccess-trial-proxy.log warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /var/lib/nginx/tmp/nodeaccess-trial-proxy/body;
    proxy_temp_path /var/lib/nginx/tmp/nodeaccess-trial-proxy/proxy;
    include /etc/nodeaccess-trial/nginx-provider.conf;
}
