services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped

  api:
    image: nodeaccess-backend:0.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: api
      SESSION_AUDIT_STORAGE_DIR: /var/lib/nodeaccess/session-audit
      USER_AVATAR_STORAGE_DIR: /var/lib/nodeaccess/user-avatars
    ports:
      - "3000:3000"
    volumes:
      - session_audit_data:/var/lib/nodeaccess/session-audit
      - user_avatar_data:/var/lib/nodeaccess/user-avatars
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  ssh-gateway:
    image: nodeaccess-backend:0.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: gateway
      SESSION_AUDIT_STORAGE_DIR: /var/lib/nodeaccess/session-audit
    ports:
      - "3001:3001"
      - "${NODEACCESS_BIND_ADDRESS:-0.0.0.0}:${NATIVE_SSH_GATEWAY_PORT:-2222}:${NATIVE_SSH_GATEWAY_PORT:-2222}"
    volumes:
      - session_audit_data:/var/lib/nodeaccess/session-audit
      - ${NATIVE_SSH_GATEWAY_HOST_KEY_DIR:-./data/ssh-gateway}:/var/lib/nodeaccess/ssh-gateway:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: nodeaccess-frontend:0.1.0
    restart: unless-stopped
    environment:
      TLS_MODE: ${TLS_MODE:-provided}
    ports:
      - "${NODEACCESS_BIND_ADDRESS:-0.0.0.0}:${NODEACCESS_HTTP_PORT:-80}:80"
      - "${NODEACCESS_BIND_ADDRESS:-0.0.0.0}:${NODEACCESS_HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_CONFIG_FILE:-./docker/nginx.https.conf}:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_started
      ssh-gateway:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
  session_audit_data:
  user_avatar_data:
