worker_processes auto;

events {
  worker_connections 1024;
}

http {
# Query strings and Referer can carry credentials; omit both from access logs.
log_format nodeaccess_safe '$remote_addr - $request_method $uri $server_protocol $status $body_bytes_sent $request_time';
access_log /var/log/nginx/access.log nodeaccess_safe;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  upstream api     { server api:3000; keepalive 32; }
  upstream gateway { server ssh-gateway:3001; keepalive 16; }

  # Preserve o protocolo publico informado por um reverse proxy do host.
  # Em acesso direto, usa o protocolo observado pelo proprio Nginx.
  map $http_x_forwarded_proto $nodeaccess_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }
  proxy_set_header X-Forwarded-Proto $nodeaccess_forwarded_proto;

  limit_req_zone  $binary_remote_addr zone=api:10m    rate=120r/m;
  limit_req_status 429;

  sendfile              on;
  tcp_nopush            on;
  tcp_nodelay           on;
  keepalive_timeout     65;
  keepalive_requests    1000;
  etag                  on;
  open_file_cache          max=2000 inactive=120s;
  open_file_cache_valid    180s;
  open_file_cache_min_uses 2;
  open_file_cache_errors   on;

  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    font/woff2;

  server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'" always;

    location /assets/ {
      expires     1y;
      add_header  Cache-Control "public, max-age=31536000, immutable";
      # Nginx replaces parent add_header directives in this location.
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'" always;
      access_log  off;
    }

    location ~* \.(?:ico|css|js|mjs|json|webmanifest|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
      expires     7d;
      add_header  Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
      # Nginx replaces parent add_header directives in this location.
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'" always;
      access_log  off;
    }

    location = /index.html {
      expires    -1;
      add_header Cache-Control "no-cache, must-revalidate";
      # Nginx replaces parent add_header directives in this location.
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'" always;
      add_header Pragma "no-cache";
      add_header Expires "0";
    }

    location = /health {
      proxy_pass         http://api/health;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Tenant-Slug $host;
      add_header         Cache-Control "no-store" always;
      # Nginx replaces parent add_header directives in this location.
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'" always;
    }

    location ^~ /health/ {
      proxy_pass         http://api/health/;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Tenant-Slug $host;
      add_header         Cache-Control "no-store" always;
      # Nginx replaces parent add_header directives in this location.
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'" always;
    }

    location = /api/v1/hosts/test-connection {
      proxy_pass         http://gateway/api/v1/hosts/test-connection;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Tenant-Slug $host;
    }

    location ^~ /api/v1/tunnels {
      proxy_pass         http://gateway/api/v1/tunnels;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Tenant-Slug $host;
    }

    location ^~ /api/v1/web-access {
      proxy_pass         http://gateway/api/v1/web-access;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Tenant-Slug $host;
    }

    location /api/ {
      limit_req          zone=api burst=30 nodelay;
      proxy_pass         http://api/api/;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Tenant-Slug $host;
      add_header         Cache-Control "no-store" always;
      # Nginx replaces parent add_header directives in this location.
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'" always;
    }

    location /ws/ {
      # Nginx error records include the raw URL. Keep sanitized access status only.
      error_log /dev/null;
      proxy_pass          http://gateway/ws/;
      proxy_http_version  1.1;
      proxy_set_header    Upgrade $http_upgrade;
      proxy_set_header    Connection "upgrade";
      proxy_set_header    Host $host;
      proxy_set_header    X-Real-IP $remote_addr;
      proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header    X-Tenant-Slug $host;
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
