upstream api     { server api:3000; keepalive 32; }
upstream gateway { server ssh-gateway:3001; keepalive 16; }

sendfile              on;
tcp_nopush            on;
tcp_nodelay           on;
keepalive_timeout     65;
keepalive_requests    1000;
etag                  on;
open_file_cache          max=2000 inactive=120s;
open_file_cache_valid    180s;
open_file_cache_min_uses 2;
open_file_cache_errors   on;

gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/manifest+json
  image/svg+xml
  font/woff2;

server {
  listen 80;
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /assets/ {
    expires     1y;
    add_header  Cache-Control "public, max-age=31536000, immutable";
    access_log  off;
  }

  location ~* \.(?:ico|css|js|mjs|json|webmanifest|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
    expires     7d;
    add_header  Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    access_log  off;
  }

  location = /index.html {
    expires    -1;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  location = /api/v1/hosts/test-connection {
    proxy_pass         http://gateway/api/v1/hosts/test-connection;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Tenant-Slug $host;
  }

  location /api/ {
    proxy_pass         http://api/api/;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Tenant-Slug $host;
    add_header         Cache-Control "no-store" always;
  }

  location /ws/ {
    proxy_pass          http://gateway/ws/;
    proxy_http_version  1.1;
    proxy_set_header    Upgrade $http_upgrade;
    proxy_set_header    Connection "upgrade";
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header    X-Tenant-Slug $host;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
