upstream api      { server api:3000; }
upstream gateway  { server ssh-gateway:3001; }
upstream frontend { server frontend:5173; }

server {
  listen 80;
  server_name localhost;

  # Teste de conexao via Agent precisa rodar no Gateway, onde vive o registry WebSocket.
  location = /api/v1/hosts/test-connection {
    proxy_pass         http://gateway/api/v1/hosts/test-connection;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Tenant-Slug     $host;
  }

  # REST API
  location /api/ {
    proxy_pass         http://api/api/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Resolve tenant pelo subdomínio e injeta como header
    proxy_set_header   X-Tenant-Slug     $host;
  }

  # WebSocket SSH
  location /ws/ {
    proxy_pass             http://gateway/ws/;
    proxy_http_version     1.1;
    proxy_set_header       Upgrade     $http_upgrade;
    proxy_set_header       Connection  "upgrade";
    proxy_set_header       Host        $host;
    proxy_set_header       X-Real-IP   $remote_addr;
    proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header       X-Tenant-Slug $host;
    proxy_read_timeout     3600s;
    proxy_send_timeout     3600s;
  }

  # Frontend Vue (com HMR para dev)
  location / {
    proxy_pass           http://frontend/;
    proxy_set_header     Host $host;
    proxy_set_header     X-Real-IP $remote_addr;
    proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version   1.1;
    proxy_set_header     Upgrade    $http_upgrade;
    proxy_set_header     Connection "upgrade";
  }
}
